<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  
  <!-- SEO & Meta Tags -->
  <title>ID Eternal — База данных объектов</title>
  <meta name="description" content="База данных объектов, транспорта и эффектов для игры. Удобный поиск и просмотр.">
  <meta name="keywords" content="id, eternal, объекты, транспорт, база данных, игра">
  <meta property="og:title" content="ID Eternal — База данных объектов">
  <meta property="og:description" content="База данных объектов, транспорта и эффектов для игры. Удобный поиск и просмотр.">
  <meta property="og:type" content="website">

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

  <!-- Vendor CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.datatables.net/2.0.8/css/dataTables.dataTables.css" />
  <link rel="stylesheet" href="https://cdn.datatables.net/fixedheader/4.0.1/css/fixedHeader.dataTables.min.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />

  <!-- Custom CSS -->
  <link rel="stylesheet" href="styles.css">
</head>

<body>
  <header>
    <div class="header-inner">
      <div class="topnav">
        <button type="button" class="custom-button" id="relsi" autocomplete="off">Eternal</button>
        <button type="button" class="custom-button" id="relorig" autocomplete="off">Original</button>
        <button type="button" class="custom-button" id="toggleCars" autocomplete="off">Cars</button>
        
        <div class="form-group">
          <input type="text" class="form-control" id="search" placeholder="Поиск по таблице...">
        </div>
        
        <div class="toggle-container">
        <img id="theme-icon" src="ImagesVehicle/ImageSite/sun.png" alt="Toggle Theme" style="cursor: pointer; width: 24px; height: 24px;">
      </div>
    </div>
  </header>

  <!-- Loader -->
  <div id="loader-container" class="loader-container">
    <div class="loader"></div>
    <p>Загрузка данных...</p>
  </div>

  <div class="base_dataTable">
    <table id="display_json_data" class="table table-bordered table-striped" style="width:100%">
      <thead>
        <tr>
          <th>Фото</th>
          <th>ID</th>
          <th>Тип</th>
          <th>Название</th>
        </tr>
      </thead>
      <tbody id="dataTable"></tbody>
    </table>
  </div>

  <!-- Theme Selection Modal -->
  <div id="themeSelectionModal" class="modal">
    <div class="modal-content">
      <h2>Выберите тему</h2>
      <p style="margin-bottom: 20px; color: var(--text-color); opacity: 0.8;">Выберите оформление, которое вам больше нравится.</p>
      <div>
        <button id="selectLightMode" class="btn btn-primary">Светлая тема</button>
        <button id="selectDarkMode" class="btn btn-secondary">Темная тема</button>
      </div>
    </div>
  </div>

  <!-- Lightbox Modal -->
  <div id="lightbox" class="lightbox">
    <span class="lightbox-close">&times;</span>
    <img class="lightbox-content" id="lightbox-img">
  </div>

  <!-- Toast Notification -->
  <div id="toast" class="toast-notification">Скопировано!</div>

  <!-- Vendor JS -->
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.datatables.net/2.0.8/js/dataTables.min.js"></script>
  <script src="https://cdn.datatables.net/fixedheader/4.0.1/js/dataTables.fixedHeader.min.js"></script>

  <!-- Custom JS -->
  <script src="script.js"></script>
</body>

</html>
